  <!-- Ecrã de Autenticação (Utilizador + Senha + Primeiro Acesso) -->
  <div id="loginBox" class="login-screen" style="display:none;">
    <div class="login-icon">🔒</div>
    <h2 id="loginTitle">Acesso Restrito</h2>
    <p id="loginDesc">Introduza o seu utilizador e senha para aceder ao portal financeiro</p>
    <div id="erroLogin" class="erro" style="display:none;"></div>

    <!-- Formulário de Login Normal -->
    <form id="formLoginNormal" onsubmit="fazerLogin(event)">
      <input type="text" id="inputUser" class="login-input" placeholder="Utilizador" required autofocus>
      <input type="password" id="inputSenha" class="login-input" placeholder="Senha de acesso" required>
      <button type="submit" id="btnEntrar" class="login-btn">Entrar no Portal</button>
      <button type="button" onclick="alternarModoLogin(true)" style="background:none; border:none; color:#0071e3; font-size:13px; font-weight:600; margin-top:14px; cursor:pointer;">
        Primeiro acesso? Definir minha senha
      </button>
    </form>

    <!-- Formulário de Criação de Senha pelo Próprio Utilizador -->
    <form id="formPrimeiroAcesso" onsubmit="criarSenhaPrimeiroAcesso(event)" style="display:none;">
      <input type="text" id="setupUser" class="login-input" placeholder="O seu utilizador autorizado" required>
      <input type="password" id="setupPass1" class="login-input" placeholder="Crie a sua nova senha (mín. 4 caracteres)" required>
      <input type="password" id="setupPass2" class="login-input" placeholder="Confirme a sua nova senha" required>
      <button type="submit" id="btnCriarSenha" class="login-btn">Guardar Senha e Entrar</button>
      <button type="button" onclick="alternarModoLogin(false)" style="background:none; border:none; color:#6e6e73; font-size:13px; font-weight:600; margin-top:14px; cursor:pointer;">
        ← Voltar ao login
      </button>
    </form>
  </div>
