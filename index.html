<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão Financeira Empresarial</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; background: #f2f2f7; margin: 0; padding: 20px 16px; color: #1c1c1e; }
    .container { max-width: 820px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; gap: 10px; flex-wrap: wrap; }
    .brand h1 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -0.3px; }
    .brand span { font-size: 12px; color: #6e6e73; }
    .header-actions { display: flex; gap: 8px; }
    .btn-new { background: #1c1c1e; color: white; border: none; padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; transition: opacity 0.15s; }
    .btn-new:hover { opacity: 0.85; }
    .btn-sync { background: white; color: #0071e3; border: 1px solid #d1d1d6; padding: 10px 14px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 4px; }
    .tab { background: #e5e5ea; color: #3a3a3c; border: none; padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; white-space: nowrap; }
    .tab.active { background: #0071e3; color: white; box-shadow: 0 2px 8px rgba(0,113,227,0.25); }

    /* Cartões de Registos */
    .card { background: white; padding: 16px 18px; border-radius: 14px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.03); }
    .card-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
    .card-title { font-size: 16px; font-weight: 600; color: #1c1c1e; }
    .badge { background: #eef6ff; color: #0071e3; padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; white-space: nowrap; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; border-top: 1px solid #f2f2f7; padding-top: 12px; }
    .prop-label { color: #8e8e93; font-size: 11px; font-weight: 600; display: block; text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 2px; }
    .prop-val { font-weight: 600; font-size: 14px; color: #1c1c1e; }

    /* Grelha de KPIs Numéricos (Saúde Financeira) */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    .kpi-card { background: white; padding: 18px; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border-left: 4px solid #0071e3; }
    .kpi-label { font-size: 12px; font-weight: 600; color: #6e6e73; text-transform: uppercase; display: block; margin-bottom: 6px; }
    .kpi-value { font-size: 24px; font-weight: 700; color: #1c1c1e; letter-spacing: -0.5px; }

    .erro { color: #d93025; background: #fce8e6; padding: 14px; border-radius: 10px; margin-bottom: 12px; font-size: 14px; }

    /* Modal Profissional Dinâmico */
    .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(3px); align-items: center; justify-content: center; padding: 16px; z-index: 100; }
    .modal-bg.open { display: flex; }
    .modal { background: white; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; border-radius: 18px; padding: 22px; box-shadow: 0 12px 35px rgba(0,0,0,0.22); }
    .modal h2 { margin: 0 0 4px 0; font-size: 19px; }
    .modal-sub { font-size: 13px; color: #6e6e73; margin-bottom: 18px; display: block; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; font-weight: 600; color: #3a3a3c; margin-bottom: 5px; }
    .field input, .field select { width: 100%; padding: 10px 12px; border: 1px solid #d1d1d6; border-radius: 10px; font-size: 15px; font-family: inherit; background: #fafafa; }
    .field input:focus, .field select:focus { outline: none; border-color: #0071e3; background: white; }
    .select-row { display: flex; gap: 6px; }
    .select-row select { flex: 1; }
    .btn-add-cat { background: #eef6ff; color: #0071e3; border: 1px solid #cce3ff; border-radius: 10px; padding: 0 12px; font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; }
    .checkbox-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
    .checkbox-row input { width: 18px; height: 18px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; border-top: 1px solid #f2f2f7; padding-top: 16px; }
    .btn-cancel { background: #e5e5ea; color: #1c1c1e; border: none; padding: 10px 16px; border-radius: 10px; font-weight: 600; cursor: pointer; }
    .btn-save { background: #0071e3; color: white; border: none; padding: 10px 18px; border-radius: 10px; font-weight: 600; cursor: pointer; }
    .btn-save:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <h1>Gestão Financeira</h1>
        <span>Sincronizado em tempo real com Notion</span>
      </div>
      <div class="header-actions">
        <button class="btn-new" id="btnNovo" onclick="abrirFormulario()">+ Novo Movimento</button>
        <button class="btn-sync" onclick="carregarDados()">Atualizar</button>
      </div>
    </header>

    <div class="tabs">
      <button class="tab active" id="tab-movimentos" onclick="mudarAba('movimentos', this)">Movimentos</button>
      <button class="tab" id="tab-folha" onclick="mudarAba('folha', this)">Folha Salarial</button>
      <button class="tab" id="tab-orcamentos" onclick="mudarAba('orcamentos', this)">Orçamentos</button>
      <button class="tab" id="tab-saude" onclick="mudarAba('saude', this)">Saúde Financeira</button>
    </div>

    <div id="lista">Carregando...</div>
  </div>

  <!-- Modal Dinâmico por Aba -->
  <div class="modal-bg" id="modalNovo">
    <div class="modal">
      <h2 id="modalTitulo">Novo Registo</h2>
      <span class="modal-sub" id="modalSubtitulo">Preencha os campos da tabela selecionada</span>
      <div id="erroForm" class="erro" style="display:none;"></div>
      <form id="formDinamico" onsubmit="salvarRegisto(event)">
        <div id="camposDinamicos">A carregar campos...</div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="fecharFormulario()">Cancelar</button>
          <button type="submit" class="btn-save" id="btnGuardar">Gravar no Notion</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let abaAtual = "movimentos";

    const configAbas = {
      movimentos: { btn: "+ Novo Movimento", titulo: "Novo Movimento Financeiro", sub: "Registar entrada, despesa ou conta a pagar/receber" },
      folha: { btn: "+ Novo Salário", titulo: "Registo de Folha Salarial", sub: "Inserir salário base, bonificações, descontos e encargos" },
      orcamentos: { btn: "+ Novo Orçamento", titulo: "Novo Orçamento Mensal", sub: "Definir previsão e realizado por categoria" },
      saude: { btn: "", titulo: "", sub: "" }
    };

    function mudarAba(novaAba, botao) {
      abaAtual = novaAba;
      document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
      botao.classList.add("active");

      const btnNovo = document.getElementById("btnNovo");
      if (configAbas[novaAba].btn) {
        btnNovo.style.display = "inline-block";
        btnNovo.textContent = configAbas[novaAba].btn;
      } else {
        btnNovo.style.display = "none";
      }

      carregarDados();
    }

    async function abrirFormulario() {
      const modal = document.getElementById("modalNovo");
      const container = document.getElementById("camposDinamicos");
      const erroBox = document.getElementById("erroForm");

      document.getElementById("modalTitulo").textContent = configAbas[abaAtual].titulo;
      document.getElementById("modalSubtitulo").textContent = configAbas[abaAtual].sub;
      erroBox.style.display = "none";
      container.innerHTML = "<p>A carregar estrutura de campos...</p>";
      modal.classList.add("open");

      try {
        const res = await fetch(`/api/notion?tab=${abaAtual}&schema=1`);
        const data = await res.json();

        if (!res.ok) {
          container.innerHTML = `<div class="erro">${data.error}</div>`;
          return;
        }

        const hoje = new Date().toISOString().split("T")[0];
        container.innerHTML = data.campos.map((campo, idx) => {
          const idCampo = `campo_${idx}`;

          if (campo.tipo === "select" || campo.tipo === "status" || campo.tipo === "multi_select") {
            const optsHtml = campo.opcoes.map(o => `<option value="${o}">${o}</option>`).join("");
            return `
              <div class="field">
                <label>${campo.nome}</label>
                <div class="select-row">
                  <select id="${idCampo}" data-col="${campo.nome}">
                    <option value="">-- Selecionar --</option>
                    ${optsHtml}
                  </select>
                  <button type="button" class="btn-add-cat" onclick="criarNovaOpcao('${idCampo}', '${campo.nome}')">+ Nova</button>
                </div>
              </div>
            `;
          }

          if (campo.tipo === "number") {
            return `
              <div class="field">
                <label>${campo.nome} (€)</label>
                <input type="number" step="0.01" data-col="${campo.nome}" placeholder="0.00">
              </div>
            `;
          }

          if (campo.tipo === "date") {
            return `
              <div class="field">
                <label>${campo.nome}</label>
                <input type="date" data-col="${campo.nome}" value="${hoje}">
              </div>
            `;
          }

          if (campo.tipo === "checkbox") {
            return `
              <div class="field">
                <label class="checkbox-row">
                  <input type="checkbox" data-col="${campo.nome}">
                  <span>${campo.nome}</span>
                </label>
              </div>
            `;
          }

          return `
            <div class="field">
              <label>${campo.nome} ${campo.tipo === "title" ? "*" : ""}</label>
              <input type="text" data-col="${campo.nome}" ${campo.tipo === "title" ? "required" : ""} placeholder="Escreva aqui...">
            </div>
          `;
        }).join("");
      } catch (e) {
        container.innerHTML = `<div class="erro">Erro de ligação ao carregar formulário.</div>`;
      }
    }

    function criarNovaOpcao(selectId, nomeColuna) {
      const nova = prompt(`Criar nova categoria/opção em "${nomeColuna}":`);
      if (nova && nova.trim() !== "") {
        const select = document.getElementById(selectId);
        const opt = document.createElement("option");
        opt.value = nova.trim();
        opt.textContent = nova.trim();
        opt.selected = true;
        select.appendChild(opt);
      }
    }

    function fecharFormulario() {
      document.getElementById("modalNovo").classList.remove("open");
    }

    async function salvarRegisto(e) {
      e.preventDefault();
      const btn = document.getElementById("btnGuardar");
      const erroBox = document.getElementById("erroForm");
      btn.disabled = true;
      btn.textContent = "A gravar...";
      erroBox.style.display = "none";

      const valores = {};
      document.querySelectorAll("#camposDinamicos [data-col]").forEach(el => {
        const col = el.getAttribute("data-col");
        valores[col] = el.type === "checkbox" ? el.checked : el.value;
      });

      try {
        const res = await fetch(`/api/notion?tab=${abaAtual}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ valores })
        });
        const data = await res.json();

        if (!res.ok) {
          erroBox.textContent = data.error || "Erro ao gravar no Notion.";
          erroBox.style.display = "block";
        } else {
          fecharFormulario();
          carregarDados();
        }
      } catch (err) {
        erroBox.textContent = "Erro de rede ao enviar dados.";
        erroBox.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "Gravar no Notion";
      }
    }

    async function carregarDados() {
      const lista = document.getElementById("lista");
      lista.innerHTML = "Sincronizando...";

      try {
        const res = await fetch(`/api/notion?tab=${abaAtual}`);
        const data = await res.json();

        if (!res.ok) {
          lista.innerHTML = `<div class="erro">${data.error}</div>`;
          return;
        }

        // Vista exclusiva de KPIs numéricos para Saúde Financeira
        if (data.mode === "kpis") {
          if (!data.kpis || data.kpis.length === 0) {
            lista.innerHTML = "<p>Nenhum indicador numérico encontrado em Saúde Financeira. Verifique se a integração Imp app está conectada às tabelas desta página.</p>";
            return;
          }
          lista.innerHTML = `
            <div class="kpi-grid">
              ${data.kpis.map(k => `
                <div class="kpi-card">
                  <span class="kpi-label">${k.indicador}</span>
                  <div class="kpi-value">${k.valor}</div>
                </div>
              `).join("")}
            </div>
          `;
          return;
        }

        if (!data.items || data.items.length === 0) {
          lista.innerHTML = "<p>Nenhum registo encontrado nesta tabela.</p>";
          return;
        }

        lista.innerHTML = data.items.map(item => `
          <div class="card">
            <div class="card-top">
              <span class="card-title">${item.titulo}</span>
              ${item.status ? `<span class="badge">${item.status}</span>` : ""}
            </div>
            ${item.colunas.length > 0 ? `
              <div class="grid">
                ${item.colunas.map(c => `
                  <div>
                    <span class="prop-label">${c.nome}</span>
                    <span class="prop-val">${c.valor}</span>
                  </div>
                `).join("")}
              </div>
            ` : ""}
          </div>
        `).join("");
      } catch (err) {
        lista.innerHTML = `<div class="erro">Erro de rede ao carregar dados.</div>`;
      }
    }

    carregarDados();
    setInterval(carregarDados, 30000);
  </script>
</body>
</html>

<body>
  <div class="container">
    <header>
      <h1>Gestão Financeira</h1>
      <div class="header-actions">
        <button class="btn-new" onclick="abrirFormulario()">+ Novo</button>
        <button class="btn-sync" onclick="carregarDados()">Atualizar</button>
      </div>
    </header>

    <div class="tabs">
      <button class="tab active" id="tab-movimentos" onclick="mudarAba('movimentos', this)">Movimentos</button>
      <button class="tab" id="tab-folha" onclick="mudarAba('folha', this)">Folha Salarial</button>
      <button class="tab" id="tab-orcamentos" onclick="mudarAba('orcamentos', this)">Orçamentos</button>
      <button class="tab" id="tab-saude" onclick="mudarAba('saude', this)">Saúde Financeira</button>
    </div>

    <div id="lista">Carregando...</div>
  </div>

  <!-- Modal Novo Movimento -->
  <div class="modal-bg" id="modalNovo">
    <div class="modal">
      <h2>Novo Movimento Financeiro</h2>
      <div id="erroForm" class="erro" style="display:none;"></div>
      <form id="formMovimento" onsubmit="salvarMovimento(event)">
        <div class="field">
          <label>Descrição / Título *</label>
          <input type="text" id="campoTitulo" placeholder="Ex: Pagamento fornecedor" required>
        </div>
        <div class="field">
          <label>Valor (€)</label>
          <input type="number" step="0.01" id="campoValor" placeholder="Ex: 150.00">
        </div>
        <div class="field">
          <label>Data</label>
          <input type="date" id="campoData">
        </div>
        <div class="field">
          <label>Estado / Categoria</label>
          <input type="text" id="campoCategoria" placeholder="Ex: Pago, Pendente, Entrada ou Saída">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="fecharFormulario()">Cancelar</button>
          <button type="submit" class="btn-save" id="btnGuardar">Gravar no Notion</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let abaAtual = "movimentos";

    function mudarAba(novaAba, botao) {
      abaAtual = novaAba;
      document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
      botao.classList.add("active");
      carregarDados();
    }

    function abrirFormulario() {
      document.getElementById("erroForm").style.display = "none";
      document.getElementById("formMovimento").reset();
      document.getElementById("campoData").value = new Date().toISOString().split("T")[0];
      document.getElementById("modalNovo").classList.add("open");
    }

    function fecharFormulario() {
      document.getElementById("modalNovo").classList.remove("open");
    }

    async function salvarMovimento(e) {
      e.preventDefault();
      const btn = document.getElementById("btnGuardar");
      const erroBox = document.getElementById("erroForm");
      btn.disabled = true;
      btn.textContent = "A gravar...";
      erroBox.style.display = "none";

      const payload = {
        titulo: document.getElementById("campoTitulo").value,
        valor: document.getElementById("campoValor").value,
        data: document.getElementById("campoData").value,
        categoria: document.getElementById("campoCategoria").value
      };

      try {
        const res = await fetch("/api/notion", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (!res.ok) {
          erroBox.textContent = data.error || "Erro ao gravar movimento.";
          erroBox.style.display = "block";
        } else {
          fecharFormulario();
          mudarAba("movimentos", document.getElementById("tab-movimentos"));
        }
      } catch (err) {
        erroBox.textContent = "Erro de rede ao enviar dados.";
        erroBox.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "Gravar no Notion";
      }
    }

    async function carregarDados() {
      const lista = document.getElementById("lista");
      lista.innerHTML = "Sincronizando...";

      try {
        const res = await fetch(`/api/notion?tab=${abaAtual}`);
        const data = await res.json();

        if (!res.ok) {
          lista.innerHTML = `<div class="erro">${data.error}</div>`;
          return;
        }

        if (data.items.length === 0) {
          lista.innerHTML = "<p>Nenhum registo encontrado nesta tabela.</p>";
          return;
        }

        lista.innerHTML = data.items.map(item => `
          <div class="card">
            <div class="card-top">
              <strong>${item.titulo}</strong>
              ${item.status ? `<span class="badge">${item.status}</span>` : ""}
            </div>
            ${item.colunas.length > 0 ? `
              <div class="grid">
                ${item.colunas.map(c => `
                  <div class="prop">
                    <span class="prop-label">${c.nome}</span>
                    <span class="prop-val">${c.valor}</span>
                  </div>
                `).join("")}
              </div>
            ` : ""}
          </div>
        `).join("");
      } catch (err) {
        lista.innerHTML = `<div class="erro">Erro de rede ao carregar dados.</div>`;
      }
    }

    carregarDados();
    setInterval(carregarDados, 30000);
  </script>
</body>
</html>
