<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Sistema</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f7; margin: 0; padding: 20px; color: #1d1d1f; }
    .container { max-width: 680px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    button { background: #0071e3; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    button:active { opacity: 0.8; }
    .card { background: white; padding: 16px; border-radius: 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
    .badge { background: #e8f2ff; color: #0071e3; padding: 4px 10px; border-radius: 6px; font-size: 13px; font-weight: 600; }
    .erro { color: #d93025; background: #fce8e6; padding: 12px; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Meu Sistema</h1>
      <button onclick="carregarDados()">Atualizar</button>
    </header>
    <div id="lista">Carregando dados do Notion...</div>
  </div>

  <script>
    async function carregarDados() {
      const lista = document.getElementById("lista");
      lista.innerHTML = "Sincronizando...";

      try {
        const res = await fetch("/api/notion");
        const data = await res.json();

        if (!res.ok) {
          lista.innerHTML = `<div class="erro">Erro: ${data.error}</div>`;
          return;
        }

        if (data.items.length === 0) {
          lista.innerHTML = "<p>Nenhum item encontrado.</p>";
          return;
        }

        lista.innerHTML = data.items.map(item => `
          <div class="card">
            <strong>${item.titulo}</strong>
            ${item.status ? `<span class="badge">${item.status}</span>` : ""}
          </div>
        `).join("");
      } catch (err) {
        lista.innerHTML = `<div class="erro">Erro de rede ao buscar dados.</div>`;
      }
    }

    carregarDados();
  </script>
</body>
</html>
